:root{--bg:#050505;--text:#f1efea;--accent:#ff2d3d;--second:#f1efea;--card:#222;--line:rgba(255,255,255,.08);--heroPos:78% 40%;--heroPosM:67% 30%;
  --display:'Italiana','Instrument Serif','Times New Roman',Georgia,serif;--head:'Cormorant Garamond','Instrument Serif',Georgia,serif;--swash:'Pinyon Script','Playfair Display',Georgia,serif;--wide:'Syncopate','Archivo','Inter',system-ui,sans-serif;}
/* To use a custom display font (Euphoria, Grance, Guilin, Roklin, Volimake, Metrina, Truth ...):
   add an @font-face for it here and put its name first in --display (--head = section headings, accent words use --swash, wide caps use --wide). */
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);scrollbar-width:none}
html::-webkit-scrollbar{display:none}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.mono{font-family:'Space Mono',ui-monospace,Menlo,monospace}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#spacer{width:1px;pointer-events:none}
#backdrop{position:fixed;inset:-6%;background:center/cover no-repeat;filter:blur(34px) saturate(1.25) brightness(.5);z-index:0;pointer-events:none}
#stage{position:fixed;inset:0;overflow:hidden;perspective:1100px;z-index:1}
#grain{position:fixed;inset:-50%;z-index:15;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-4%,3%)}40%{transform:translate(3%,-5%)}60%{transform:translate(-6%,-2%)}80%{transform:translate(5%,4%)}100%{transform:translate(0,0)}}
#vig{position:fixed;inset:0;z-index:14;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}

/* ---------- cards ---------- */
.card{position:absolute;left:50%;top:50%;background:var(--card);border:1px solid var(--line);border-radius:2.2em;color:var(--text);overflow:hidden;backface-visibility:hidden;pointer-events:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.card{display:block}
.card:not(.on){display:none!important}
.card.live{pointer-events:auto}
.card.peek{pointer-events:auto}                /* cards that are still clearly visible next to the focused one stay clickable (e.g. Instagram while on the form) */
.card h1,.card h2,.card h3{font-weight:500;letter-spacing:-.035em;line-height:1.02}
.dim{font-family:var(--swash);font-style:normal;font-weight:400;font-size:1.2em;line-height:.8;text-transform:lowercase;letter-spacing:0;color:rgba(241,239,234,.78)}
.eyebrow{font-size:.9em;letter-spacing:.14em;text-transform:uppercase;color:rgba(241,239,234,.6)}
.btn{display:inline-flex;align-items:center;gap:.5em;padding:.75em 1.4em;border-radius:99em;font-size:1em;font-weight:500;transition:transform .5s cubic-bezier(.34,1.56,.64,1),background .3s}
.btn:hover{transform:scale(1.06)}
.btn.pri{background:var(--accent);color:#fff}
.btn.sec{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
.chips{display:flex;flex-wrap:wrap;gap:.5em}
.chip{font-family:'Space Mono',monospace;font-size:.88em;padding:.45em .95em;border-radius:99em;border:1px solid rgba(255,255,255,.14);color:rgba(241,239,234,.8);white-space:nowrap}
.chip.on2{background:var(--second);color:#111;border-color:transparent}

/* hero */
/* desktop: the photo sits right of centre so the headline never covers the face; a blurred copy fills the left strip */
.t-hero .bgfill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:0% 40%;filter:blur(26px) saturate(1.1) brightness(.75);transform:scale(1.15)}
.t-hero .bgimg{position:absolute;top:0;left:17%;width:100%;height:100%;object-fit:cover;object-position:var(--heroPos);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 24%);mask-image:linear-gradient(90deg,transparent 0,#000 24%)}
.t-hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,5,5,.88) 0%,rgba(5,5,5,.55) 38%,transparent 66%),linear-gradient(0deg,rgba(5,5,5,.75),transparent 40%)}
.t-hero .bar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:.5em;padding:1.1em 1.6em;font-size:.9em;color:rgba(255,255,255,.55)}
.t-hero .bar i{width:.8em;height:.8em;border-radius:50%;background:rgba(255,255,255,.22)}
.t-hero .bar span{margin-left:.9em}.t-hero .bar .rec{margin-left:auto;color:var(--accent)}
.t-hero .copy{position:absolute;left:2.4em;bottom:5.6em;width:60%}
.t-hero h1{font-family:var(--display);font-weight:400;font-size:3.25em;line-height:1.02;letter-spacing:.005em;margin:.25em 0 .3em}
.t-hero .sub{font-size:1em;line-height:1.45;color:rgba(241,239,234,.78);max-width:28em;margin-bottom:1.1em}
.t-hero .cta{display:flex;gap:.8em;flex-wrap:wrap}
.marq{position:absolute;left:0;right:0;bottom:1.6em;overflow:hidden;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marq .track{display:inline-flex;gap:.7em;animation:marq 30s linear infinite;padding-left:.7em}
@keyframes marq{to{transform:translateX(-50%)}}
.marq .chip{background:rgba(5,5,5,.5)}

/* service cards */
.t-svc{padding:2.4em;display:flex;flex-direction:column;gap:1em}
.t-svc h2{font-family:var(--head);font-weight:400;font-size:2.25em;line-height:.98;letter-spacing:-.015em;margin:.1em 0 .2em}
.t-svc p.lead{font-size:1em;line-height:1.5;color:rgba(241,239,234,.66);max-width:30em}
.roller{display:flex;align-items:flex-end;gap:.4em;margin-top:auto}
.roller .win{overflow:hidden;height:1em;line-height:1;font-size:4.4em;font-weight:500;letter-spacing:-.05em;color:var(--accent)}
.roller .win.words{font-size:3em;color:var(--text)}
.roller ul{list-style:none;animation:roll4 6s cubic-bezier(.7,0,.2,1) infinite}
.roller ul.w5{animation-name:roll5;animation-duration:7.5s}
.roller li{height:1em;white-space:nowrap}
.roller .u{font-size:1em;margin-bottom:.9em}
@keyframes roll4{0%,18%{transform:translateY(0)}25%,43%{transform:translateY(-1em)}50%,68%{transform:translateY(-2em)}75%,93%{transform:translateY(-3em)}100%{transform:translateY(-4em)}}
@keyframes roll5{0%,14%{transform:translateY(0)}20%,34%{transform:translateY(-1em)}40%,54%{transform:translateY(-2em)}60%,74%{transform:translateY(-3em)}80%,94%{transform:translateY(-4em)}100%{transform:translateY(-5em)}}
.t-svc .dots{display:flex;gap:.5em}.dotc{width:1.2em;height:1.2em;border-radius:50%;border:1px solid rgba(255,255,255,.12)}

/* small cluster cards */
.t-counter{padding:1.6em;display:flex;flex-direction:column;justify-content:space-between}
.t-counter b{font-family:var(--wide);font-stretch:125%;font-size:2.8em;font-weight:800;letter-spacing:-.02em}
.t-pill{display:grid;place-items:center;border-radius:99em;font-family:var(--wide);text-transform:uppercase;font-size:.95em;font-weight:400;letter-spacing:.02em}
.t-pill.a{background:var(--accent);color:#fff}.t-pill.b{background:var(--second);color:#111}
.t-img img{width:100%;height:100%;object-fit:cover}
.t-info{padding:1.6em;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));display:flex;flex-direction:column;justify-content:space-between;font-size:1em}
.t-info p{font-size:1.5em;letter-spacing:-.03em;line-height:1.1}
.live-dot{color:#7dff9b}
.t-dots{display:flex;align-items:center;justify-content:center;gap:.9em;border-radius:99em}
.t-dots i{width:2em;height:2em;border-radius:50%}
.t-chip{display:grid;place-items:center;border-radius:99em;font-size:1em;letter-spacing:.04em}

/* work cards */
.t-work{cursor:pointer}
.t-work img.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.t-work:hover img.art{transform:scale(1.05)}
.t-work .shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,5,5,.82),transparent 55%)}
.t-work .idx{position:absolute;top:1.4em;left:1.6em;font-size:.9em;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.t-work .play{position:absolute;top:50%;left:50%;width:4.4em;height:4.4em;margin:-2.2em;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;font-size:1em;transition:transform .5s cubic-bezier(.34,1.56,.64,1),background .3s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.t-work:hover .play{transform:scale(1.18);background:var(--accent)}
.t-work .meta{position:absolute;left:1.8em;right:1.8em;bottom:1.5em}
.t-work h3{font-size:2.1em;margin-bottom:.3em}
.t-work .meta p{font-size:.9em;letter-spacing:.08em;text-transform:uppercase;color:rgba(241,239,234,.7)}

/* library cards */
.t-lib{padding:2em 2.2em;display:flex;flex-direction:column;gap:1.1em}
.t-lib .head{display:flex;align-items:flex-end;justify-content:space-between;gap:1em}
.t-lib h2{font-family:var(--display);font-size:2.8em}
.t-lib .q{width:17em;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:99em;padding:.7em 1.2em;font-size:1em;outline:none;transition:border .3s,background .3s}
.t-lib .q:focus{border-color:var(--accent);background:rgba(255,255,255,.1)}
.t-lib .cats{display:flex;flex-wrap:wrap;gap:.5em}
.t-lib .cats button{font-family:'Space Mono',monospace;font-size:.9em;padding:.5em 1.1em;border-radius:99em;border:1px solid rgba(255,255,255,.14);color:rgba(241,239,234,.75);transition:transform .45s cubic-bezier(.34,1.56,.64,1),background .3s,color .3s}
.t-lib .cats button:hover{transform:scale(1.07)}
.t-lib .cats button.act{background:var(--accent);border-color:transparent;color:#fff}
.t-lib .grid{flex:1;min-height:0;display:grid;gap:1em;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}
.t-lib .grid.g4{grid-template-columns:repeat(4,1fr)}
.t-lib .foot{display:flex;align-items:center;justify-content:space-between;font-size:.9em;color:rgba(241,239,234,.6)}
.t-lib .pager{display:flex;align-items:center;gap:.8em}
.t-lib .pager button{width:2.6em;height:2.6em;border-radius:50%;border:1px solid rgba(255,255,255,.16);transition:transform .45s cubic-bezier(.34,1.56,.64,1),background .3s}
.t-lib .pager button:hover:not(:disabled){transform:scale(1.12);background:rgba(255,255,255,.12)}
.t-lib .pager button:disabled{opacity:.3;cursor:default}
.empty{grid-column:1/-1;display:grid;place-items:center;color:rgba(241,239,234,.5);font-size:1em}
/* ---- film library: streaming-style browse (featured film + poster row) ---- */
.t-film{padding:0;display:block;background:#0b0b0b}
.t-film .fbg{position:absolute;inset:0;overflow:hidden}
.t-film .fbg img,.t-film .fbg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 35%;opacity:0;transition:opacity .8s}
.t-film .fbg .on{opacity:1}
.t-film .fbg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,5,5,.9) 0,rgba(5,5,5,.55) 36%,rgba(5,5,5,.06) 72%),linear-gradient(0deg,#050505 0,rgba(5,5,5,.88) 24%,transparent 56%),linear-gradient(180deg,rgba(5,5,5,.72),transparent 24%)}
.t-film .fnav{position:absolute;z-index:3;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:1em;padding:1.5em 2.4em}
.t-film .ftabs{display:flex;gap:1.6em;flex:1;overflow-x:auto;scrollbar-width:none;min-width:0}
.t-film .ftabs::-webkit-scrollbar,.t-film .fstrip::-webkit-scrollbar{display:none}
.t-film .ftabs button{font-family:'Space Mono',monospace;font-size:.78em;letter-spacing:.14em;text-transform:uppercase;color:rgba(241,239,234,.6);padding:.45em 0;border-bottom:2px solid transparent;white-space:nowrap;transition:color .25s,border-color .25s}
.t-film .ftabs button:hover{color:#fff}
.t-film .ftabs button.act{color:#fff;border-color:var(--accent)}
.t-film .fsearch{flex:none;display:flex;align-items:center;gap:.5em;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:99em;padding:.5em .95em;transition:border .3s}
.t-film .fsearch:focus-within{border-color:var(--accent)}
.t-film .fsearch svg{width:1.05em;height:1.05em;flex:none;opacity:.85}
.t-film .fsearch input{width:7em;background:none;border:0;outline:0;font-size:.85em;transition:width .35s}
.t-film .fsearch input:focus{width:12em}
.t-film .ffeat{position:absolute;z-index:2;left:2.4em;top:12.5%;width:56%}
.t-film .ftitle{text-transform:uppercase;font-family:var(--display);font-size:3.3em;font-weight:400;line-height:.92;letter-spacing:-.015em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-bottom:.06em}
.t-film .ftitle em,.pm .ctitle em{font-family:var(--swash);font-style:normal;font-weight:400;font-size:1.25em;line-height:.7;text-transform:lowercase;letter-spacing:0}
.t-film .fmeta{display:flex;flex-wrap:wrap;gap:.3em 1.1em;margin:.7em 0 .6em;font-size:.82em;color:rgba(241,239,234,.72)}
.t-film .fmeta .g{color:#7dff9b}
.t-film .fdesc{margin:0 0 .9em;max-width:30em;font-size:.92em;line-height:1.45;color:rgba(241,239,234,.78);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t-film .fbtns{display:flex;align-items:center;gap:.8em}
.t-film .fplay{background:var(--accent);color:#fff;font-family:var(--wide);font-weight:400;text-transform:uppercase;letter-spacing:.08em;font-size:.82em;padding:.85em 2.4em;border-radius:99em;transition:transform .45s cubic-bezier(.34,1.56,.64,1),filter .3s}
.t-film .fplay:hover{transform:scale(1.06);filter:brightness(1.12)}
.t-film .fadd{width:2.6em;height:2.6em;border-radius:50%;border:1.5px solid rgba(255,255,255,.75);font-size:1.05em;line-height:1;display:grid;place-items:center;transition:transform .45s cubic-bezier(.34,1.56,.64,1),background .3s}
.t-film .fadd:hover{transform:scale(1.1);background:rgba(255,255,255,.14)}
.t-film .fcount{display:none;margin-left:auto;font-size:.72em;letter-spacing:.14em;color:rgba(241,239,234,.5);white-space:nowrap}
.t-film .frows{position:absolute;z-index:3;left:0;right:0;bottom:0;top:49%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:0 0 1.2em 2.4em;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 1.2em);mask-image:linear-gradient(180deg,transparent 0,#000 1.2em)}
.t-film .frows::-webkit-scrollbar{display:none}
.t-film .rw{margin-bottom:.5em}
.t-film .frh{display:flex;align-items:center;justify-content:space-between;padding-right:2.4em;margin:.5em 0 0}
.t-film .frh h4{font-size:.95em;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.t-film .frh .cnt{margin-left:.8em;font-weight:400;font-size:.8em;color:rgba(241,239,234,.55)}
.t-film .farr{display:flex;gap:.5em}
.t-film .farr button{width:2em;height:2em;border-radius:50%;border:1px solid rgba(255,255,255,.22);font-size:.85em;transition:transform .4s cubic-bezier(.34,1.56,.64,1),background .3s}
.t-film .farr button:hover{transform:scale(1.12);background:rgba(255,255,255,.14)}
.t-film .fgrid{display:flex;flex-wrap:wrap;gap:1em .95em;padding:.9em 2.4em .6em 0}
.t-film .fstrip{display:flex;gap:.95em;overflow-x:auto;scrollbar-width:none;padding:.9em 2.4em .8em 0;cursor:grab}
.t-film .pst{flex:none;width:12.4em;aspect-ratio:16/9;position:relative;border-radius:.9em;overflow:hidden;cursor:pointer;background:#161616;border:1px solid rgba(255,255,255,.1);transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .3s,box-shadow .3s}
.t-film .pst:hover{transform:scale(1.04);z-index:2;box-shadow:0 .8em 2em rgba(0,0,0,.6)}
.t-film .pst.dz{width:auto;height:8.4em;min-width:4.6em;max-width:19em}
.t-film[data-kind="d"] .fbg img{filter:blur(34px) brightness(.6) saturate(1.3);transform:scale(1.25)}
.t-film .fposter{position:absolute;z-index:2;right:9%;top:12%;height:34%;max-width:30%;object-fit:contain;border-radius:.9em;box-shadow:0 1.4em 3.4em rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.14);opacity:0;transition:opacity .7s}
.t-film .fposter.on{opacity:1}
.t-film[data-kind="d"] .ffeat{width:44%}
.t-film .pst.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.t-film .pst img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.t-film .pst .tm{position:absolute;left:0;right:0;bottom:0;padding:1.8em .6em .55em;background:linear-gradient(0deg,rgba(5,5,5,.92),transparent)}
.t-film .pst .tm b{display:block;font-weight:600;font-size:.7em;line-height:1.15;letter-spacing:-.01em}
.t-film .pst .tm span{display:block;margin-top:.2em;font-size:.55em;letter-spacing:.08em;text-transform:uppercase;color:rgba(241,239,234,.6)}
.t-film .pst .dur{position:absolute;top:.5em;right:.5em;font-size:.58em;padding:.25em .6em;border-radius:99em;background:rgba(5,5,5,.65)}
.t-film .empty{align-self:center;padding:2em 0;color:rgba(241,239,234,.6)}
body.mob .t-film .fnav{padding:1.1em 1.2em;gap:.6em}
body.mob .t-film .ftabs{gap:1.1em}
body.mob .t-film .fsearch{padding:.45em .8em}
body.mob .t-film .fsearch input{width:4.4em}body.mob .t-film .fsearch input:focus{width:7em}
body.mob .t-film .ffeat{left:1.3em;top:13%;width:90%}
body.mob .t-film .ftitle{font-size:3em}
body.mob .t-film .fdesc{display:none}
body.mob .t-film .fmeta{margin:.8em 0 1em}
body.mob .t-film .frows{top:45%;padding-left:1.3em}
body.mob .t-film .frh{padding-right:1.3em}
body.mob .t-film .fstrip,body.mob .t-film .fgrid{padding-right:1.3em}
body.mob .t-film .pst{width:10.4em}
body.mob .t-film .pst.dz{height:7.4em;max-width:15em}
body.mob .t-film .fposter{display:none}
body.mob .t-film[data-kind="d"] .frows{top:34%}
body.mob .t-film .fcount{display:none}
.tile{position:relative;border-radius:1.4em;overflow:hidden;background:#161616;cursor:pointer;border:1px solid rgba(255,255,255,.07);transition:transform .6s cubic-bezier(.34,1.56,.64,1);min-height:0}
.tile:hover{transform:scale(1.035)}
.tile img,.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile video{opacity:0;transition:opacity .4s}.tile video.on{opacity:1}
.tile::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.22),transparent 55%);opacity:0;transition:opacity .35s}
.tile:hover::after{opacity:1}
.tile .tm{position:absolute;left:0;right:0;bottom:0;padding:2.2em .9em .8em;background:linear-gradient(0deg,rgba(5,5,5,.88),transparent);z-index:1}
.tile .tm b{display:block;font-weight:500;font-size:.95em;letter-spacing:-.02em;line-height:1.15}
.tile .tm span{font-size:.8em;letter-spacing:.08em;text-transform:uppercase;color:rgba(241,239,234,.65)}
.tile .dur{position:absolute;top:.7em;right:.7em;z-index:1;font-size:.8em;padding:.3em .7em;border-radius:99em;background:rgba(5,5,5,.6)}

/* about */
.t-about{display:grid;grid-template-columns:41% 1fr;font-size:1em}
.t-about .ph{position:relative}.t-about .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--aboutPos,80% 35%)}
.t-about .tx{padding:2em 2.2em;display:flex;flex-direction:column;gap:.85em;min-width:0}
.t-about h2{font-family:var(--head);font-weight:400;font-size:2.7em;line-height:.98;letter-spacing:-.015em}
.t-about p{font-size:1.02em;line-height:1.5;color:rgba(241,239,234,.7)}
.t-about h4{font-family:'Space Mono',monospace;font-weight:400;font-size:.84em;letter-spacing:.14em;text-transform:uppercase;color:rgba(241,239,234,.5);margin-bottom:.5em}
.t-about ul{list-style:none;display:grid;gap:.35em;font-size:1em;color:rgba(241,239,234,.82)}
.t-about ul li::before{content:"— ";color:var(--accent)}
.t-about .two{display:grid;grid-template-columns:1fr 1fr;gap:1.4em}
.steps{display:flex;gap:.6em}.steps div{flex:1;border:1px solid rgba(255,255,255,.1);border-radius:1em;padding:.7em .8em;font-size:.9em}
.steps b{display:block;font-family:'Space Mono',monospace;font-weight:400;color:var(--accent);margin-bottom:.3em}

/* contact */
.t-ct{padding:1.8em;display:flex;flex-direction:column;justify-content:space-between;gap:.6em}
.t-ct .val{font-size:1.55em;letter-spacing:-.03em;user-select:text;-webkit-user-select:text;word-break:break-all;line-height:1.1}
.t-ct .row{display:flex;gap:.6em;align-items:center;flex-wrap:wrap}
.t-ct a.lnk{color:rgba(241,239,234,.8)}
.t-ct.link{transition:background .4s}
.t-ct.link:hover{background:#2c2c2c}
.t-wa{background:var(--accent);border-color:transparent;display:flex;align-items:center;justify-content:center;font-size:1em;font-weight:600;letter-spacing:-.04em;border-radius:99em;color:#fff}
.t-form{padding:2.2em;display:flex;flex-direction:column;gap:.9em}
.t-form h2{font-family:var(--head);font-weight:400;font-size:2.6em;line-height:.98;letter-spacing:-.015em}
.t-form form{display:flex;flex-direction:column;gap:.7em;flex:1}
.t-form .f{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:1.1em;padding:.8em 1em;font-size:1.05em;outline:none;width:100%;transition:border .3s}
.t-form .f:focus{border-color:var(--accent)}
.t-form textarea.f{resize:none;flex:1;min-height:4em}
.t-form select.f option{background:#222}
.t-form .hp{position:absolute;left:-9999px}
.t-form .two{display:grid;grid-template-columns:1fr 1fr;gap:.7em}
body.mob .t-form .two{grid-template-columns:1fr}
.t-form .st{font-size:.9em;min-height:1.4em;color:rgba(241,239,234,.7)}

/* decor */
.d-dot{border-radius:50%}.d-bar{border-radius:99em}.d-ring{border-radius:50%;background:transparent!important;border:1px solid rgba(255,255,255,.22)}
.d-chip{display:grid;place-items:center;font-family:'Space Mono',monospace;font-size:1em;border-radius:99em;color:rgba(241,239,234,.8);background:#1b1b1b;letter-spacing:.06em}
.card.decor{border:0;box-shadow:none}

/* HUD */
.hud{position:fixed;z-index:20;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:rgba(241,239,234,.9)}
#hTL{top:22px;left:26px;display:flex;align-items:center;gap:16px}
#hTL .logo{font-family:Inter,sans-serif;font-weight:600;font-size:18px;letter-spacing:-.04em;text-transform:none;padding:6px 12px;border-radius:99em;background:rgba(255,255,255,.1);border:1px solid var(--line)}
#chap{color:rgba(241,239,234,.6);transition:opacity .3s}
#hTR{top:26px;right:26px;display:flex;align-items:center;gap:18px}
#hTR a{padding:8px 14px;border-radius:99em;border:1px solid rgba(255,255,255,.2);transition:background .3s,color .3s}
#hTR a:hover{background:var(--text);color:#111}
#cap{left:26px;bottom:24px;line-height:1.7;color:rgba(241,239,234,.7);max-width:46vw}
#cap span{display:block;transition:opacity .35s,transform .35s}
#cap.sw span{opacity:0;transform:translateY(6px)}
#hBR{right:26px;bottom:24px;text-align:right;line-height:1.7;color:rgba(241,239,234,.7)}
#dots{position:fixed;z-index:20;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:3px}
#dots button{width:18px;height:14px;display:grid;place-items:center}
#dots button::after{content:"";width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.28);transition:all .35s}
#dots button.act::after{background:var(--accent);height:14px;border-radius:3px}

/* modal / lightbox */
.ov{position:fixed;inset:0;z-index:100;display:none;background:rgba(5,5,5,.88);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);opacity:0;transition:opacity .45s}
.ov.show{display:block}.ov.in{opacity:1}
.ov .x{position:absolute;top:18px;right:20px;z-index:3;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);font-size:20px;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.ov .x:hover{transform:scale(1.12) rotate(90deg)}
.pm .pick{display:inline-block;margin:0 .3em;padding:.35em .9em;border-radius:99em;background:var(--accent);color:#fff;cursor:pointer}
.pm .note{position:absolute;left:0;right:0;bottom:0;padding:14px 18px;font-size:12px;background:rgba(5,5,5,.7);color:rgba(241,239,234,.8)}
/* ---- cinematic film viewer ---- */
#pm{background:rgba(4,4,4,.9)}
.pm{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateY(24px) scale(.985);transition:opacity .6s,transform .7s cubic-bezier(.2,.8,.2,1)}
.ov.in .pm{opacity:1;transform:none}
.pm .cbg{position:absolute;inset:-8%;z-index:0;pointer-events:none;background:#000}
.pm .cbg img{width:100%;height:100%;object-fit:cover;filter:blur(46px) saturate(1.35) brightness(.5);transform:scale(1.1)}
.pm .ctop{position:absolute;z-index:6;top:0;left:0;right:0;height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 84px 0 28px;pointer-events:none}
.pm .ctop>*{pointer-events:auto}
.pm .clogo{font-weight:700;font-size:17px;letter-spacing:-.02em}
.pm .cswitch{position:relative}
.pm .cchip{display:flex;align-items:center;gap:10px;max-width:min(60vw,340px);padding:6px 14px 6px 6px;border-radius:14px;background:rgba(245,243,238,.94);color:#111;font-size:12px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.pm .cchip img{width:30px;height:30px;border-radius:8px;object-fit:cover;flex:none}
.pm .cchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm .clist{position:absolute;right:0;top:calc(100% + 8px);width:min(86vw,340px);max-height:60vh;overflow-y:auto;padding:8px;border-radius:16px;background:rgba(18,18,18,.97);border:1px solid rgba(255,255,255,.14);display:none;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.pm .cswitch.open .clist{display:block}
.pm .clist button{display:flex;align-items:center;gap:12px;width:100%;padding:8px;border-radius:10px;text-align:left;font-size:13px;transition:background .2s}
.pm .clist button:hover,.pm .clist button.cur{background:rgba(255,255,255,.1)}
.pm .clist img{width:54px;height:36px;border-radius:6px;object-fit:cover;flex:none}
.pm .clist b{display:block;font-weight:600;line-height:1.2}
.pm .clist small{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(241,239,234,.55)}
.pm .cstack{position:relative;z-index:2;margin:auto;width:min(94vw,calc((100vh - 128px) * 16 / 9));transition:opacity .3s,transform .35s cubic-bezier(.4,0,.2,1)}
.pm.goD .cstack{opacity:0;transform:translateY(-7%)}.pm.goU .cstack{opacity:0;transform:translateY(7%)}
.pm.inD .cstack{animation:cinD .55s cubic-bezier(.2,.8,.2,1)}.pm.inU .cstack{animation:cinU .55s cubic-bezier(.2,.8,.2,1)}
@keyframes cinD{from{opacity:0;transform:translateY(9%)}}@keyframes cinU{from{opacity:0;transform:translateY(-9%)}}
.pm .cpeek{position:absolute;left:3.5%;right:3.5%;height:46px;z-index:1;overflow:hidden;border-radius:18px;border:1px solid rgba(255,255,255,.1);background:#111;opacity:.8;transition:opacity .3s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.pm .cpeek.up{top:-24px}.pm .cpeek.down{bottom:-24px}
.pm .cpeek:hover{opacity:1}.pm .cpeek.up:hover{transform:translateY(-6px)}.pm .cpeek.down:hover{transform:translateY(6px)}
.pm .cpeek img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.38)}
.pm .cpeek span{position:absolute;left:0;right:0;text-align:center;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 16px}
.pm .cpeek.up span{top:5px}.pm .cpeek.down span{bottom:5px}
.pm .cframe{position:relative;z-index:2;aspect-ratio:16/9;border-radius:28px;overflow:hidden;background:#000;border:1px solid rgba(255,255,255,.14);box-shadow:0 40px 110px rgba(0,0,0,.7);container-type:inline-size}
.pm .cvid{position:absolute;inset:0;font-size:max(8.5px,1.12cqw)}

const $=(s,r=document)=>r.querySelector(s);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const eio4=t=>t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2;
const safeUrl=u=>{u=String(u||'').trim();return !/^\s*javascript:/i.test(u)&&/^(https?:\/\/|\/|\.\/|data:image\/|[\w@.-][\w@. \/%()-]*$)/i.test(u)?u:''};
/* ---- Vimeo: link -> {id,h}; thumbnail/duration come from Vimeo's public oEmbed ---- */
const vmParse=s=>{s=String(s||'').trim();if(!s)return null;
  const m=/vimeo\.com\/(?:[^?#]*\/)?(\d{5,})(?:\/([0-9a-f]{6,}))?(?:[^#]*[?&]h=([0-9a-f]+))?/i.exec(s);if(m)return{id:m[1],h:m[2]||m[3]||''};
  return /^\d{5,}$/.test(s)?{id:s,h:''}:null};
const vmSrc=(v,mode)=>`https://player.vimeo.com/video/${v.vm.id}?${v.vm.h?'h='+v.vm.h+'&':''}autoplay=1&playsinline=1&title=0&byline=0&portrait=0&badge=0&dnt=1`+(mode==='custom'?'&controls=0':mode==='background'?'&background=1':'');
const mmss0=t=>{t=Math.max(0,Math.floor(t||0));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
function normVideos(list){for(const v of list){const m=vmParse(v.vimeo)||(v.src&&/vimeo\.com/i.test(v.src)?vmParse(v.src):null);if(m){v.vm=m;v.src=''}}return list}
async function vmEnrich(list){
  await Promise.all(list.filter(v=>v.vm&&(!v.poster||!v.duration)).map(async v=>{
    try{const ac=new AbortController(),to=setTimeout(()=>ac.abort(),3500);
      const r=await fetch('https://vimeo.com/api/oembed.json?width=1280&url='+encodeURIComponent('https://vimeo.com/'+v.vm.id+(v.vm.h?'/'+v.vm.h:'')),{signal:ac.signal});clearTimeout(to);
      if(!r.ok)return;const j=await r.json();
      if(!v.poster&&j.thumbnail_url)v.poster=j.thumbnail_url;
      if(!v.duration&&j.duration)v.duration=mmss0(j.duration);
      if(!v.title&&j.title)v.title=j.title;
      if(!v.desc&&j.description)v.desc=String(j.description).slice(0,260);
    }catch(_){}}));
}
/* ---- Vimeo Player SDK + a tiny adapter that looks like a <video> to the rest of the viewer ---- */
let _vmSDK=null;
const vmSDK=()=>_vmSDK||(_vmSDK=new Promise((res,rej)=>{if(window.Vimeo&&window.Vimeo.Player)return res(window.Vimeo);const s=document.createElement('script');s.src='https://player.vimeo.com/api/player.js';s.onload=()=>res(window.Vimeo);s.onerror=()=>{_vmSDK=null;rej(new Error('sdk'))};document.head.appendChild(s)}));
class VM{
  constructor(iframe){this.paused=true;this.ended=false;this.duration=0;this._t=0;this._m=false;this.ls={};this.p=null;this.q=[];this.dead=false;
    vmSDK().then(V=>{if(this.dead)return;const p=this.p=new V.Player(iframe);
      p.on('play',()=>{this.paused=false;this.ended=false;this.emit('play')});
      p.on('pause',()=>{this.paused=true;this.emit('pause')});
      p.on('ended',()=>{this.paused=true;this.ended=true;this.emit('ended')});
      p.on('timeupdate',d=>{this._t=d.seconds;if(d.duration)this.duration=d.duration;this.emit('timeupdate')});
      p.on('volumechange',d=>{this._m=d.volume===0;this.emit('volumechange')});
      p.getDuration().then(d=>{this.duration=d;this.emit('loadedmetadata')}).catch(()=>{});
      this.q.splice(0).forEach(f=>f(p))}).catch(()=>{})}
  addEventListener(n,f){(this.ls[n]=this.ls[n]||[]).push(f)}
  emit(n){(this.ls[n]||[]).forEach(f=>f())}
  run(f){this.p?f(this.p):this.q.push(f)}
  play(){this.run(p=>p.play().catch(()=>{}));return Promise.resolve()}
  pause(){this.run(p=>p.pause().catch(()=>{}))}
  get currentTime(){return this._t}
  set currentTime(x){this._t=x;this.run(p=>p.setCurrentTime(x).catch(()=>{}))}
  get muted(){return this._m}
  set muted(m){this._m=m;this.run(p=>p.setVolume(m?0:1).catch(()=>{}));this.emit('volumechange')}
  destroy(){this.dead=true;try{this.p&&this.p.destroy()}catch(_){}}
}

function csvParse(t){const rows=[];let r=[],c='',q=false;t=String(t).replace(/^﻿/,'');
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()!==''))rows.push(r);r=[]}
    else c+=ch}
  r.push(c);if(r.some(x=>x.trim()!==''))rows.push(r);
  if(!rows.length)return[];const h=rows[0].map(x=>x.trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''));
  return rows.slice(1).map(a=>{const o={};h.forEach((k,i)=>{if(k)o[k]=(a[i]||'').trim()});return o})}
async function sheetGet(url){if(!url)return null;try{const ac=new AbortController(),to=setTimeout(()=>ac.abort(),6000);const r=await fetch(url,{signal:ac.signal,cache:'no-store'});clearTimeout(to);return r.ok?csvParse(await r.text()):null}catch(_){return null}}
const slug=(t,i,seen)=>{let b=String(t||'item').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'item',id=b;if(seen){for(let n=2;seen.has(id);n++)id=b+'-'+n;seen.add(id)}return id};
const hiddenRow=r=>/^(no|hide|hidden|false|0|off)$/i.test(r.show||r.visible||'')||/^(yes|true|1)$/i.test(r.hidden||'');
const csvList=s=>String(s||'').split(/[,|]/).map(x=>x.trim()).filter(Boolean);
function applySiteRows(rows){
  const roots=new Set(['brand','cluster','colors','hero','about','contact','services','videoCats','designCats','vimeoControls','hudLink']);
  for(const r of rows){const key=(r.key||r.setting||'').trim(),val=r.value!==undefined?r.value:(r.text||'');if(!key||val==='')continue;
    const path=key.split('.');if(!roots.has(path[0]))continue;
    let o=CONFIG;for(let i=0;i<path.length-1&&o;i++)o=o[path[i]]&&typeof o[path[i]]==='object'?o[path[i]]:null;
    if(!o)continue;const k=path[path.length-1];if(!(k in o)&&path.length>1)continue;
    if(Array.isArray(o[k]))o[k]=csvList(val);
    else if(/(^|\.)(img|image)$/i.test(key))o[k]=safeUrl(val)||o[k];
    else o[k]=String(val).replace(/\\n/g,'\n')}
}

const PAL=[['#ff2d3d','#16030a'],['#f1efea','#2a2a2a'],['#2b2b2b','#ff2d3d'],['#0d0d0d','#ff6a3d'],['#7a0d18','#050505'],['#e9e2d4','#b3121f']];
function art(it,vid){
  if(it.poster)return it.poster; if(it.img)return it.img;
  const seed=[...it.id].reduce((a,c)=>a+c.charCodeAt(0),0);
  const [a,b]=PAL[seed%PAL.length]; const w=vid?1280:(it.w||1000), h=vid?720:(it.h||1250);
  const dark=(a==='#f1efea'||a==='#e9e2d4'); const fg=dark?'#111':'#f1efea';
  const word=(it.category||'').split(' ')[0].toUpperCase();const fsz=Math.min(Math.min(w,h)*.16,(w*.72)/(word.length*.62));
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}' viewBox='0 0 ${w} ${h}'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${a}'/><stop offset='1' stop-color='${b}'/></linearGradient></defs><rect width='100%' height='100%' fill='url(#g)'/><circle cx='${w*(.25+(seed%5)*.12)}' cy='${h*.38}' r='${Math.min(w,h)*.3}' fill='none' stroke='${fg}' stroke-opacity='.25' stroke-width='2'/><circle cx='${w*(.25+(seed%5)*.12)}' cy='${h*.38}' r='${Math.min(w,h)*.18}' fill='${fg}' fill-opacity='.08'/><text x='${w*.14}' y='${h*.5}' font-family='Helvetica,Arial,sans-serif' font-weight='700' font-size='${fsz}' letter-spacing='-2' fill='${fg}'>${word}</text><text x='${w*.14}' y='${h*.56}' font-family='Courier New,monospace' font-size='${Math.min(w,h)*.028}' letter-spacing='3' fill='${fg}' fill-opacity='.7'>${esc(it.title.toUpperCase().slice(0,26))}</text><text x='${w*.94}' y='${h*.1}' text-anchor='end' font-family='Courier New,monospace' font-size='${Math.min(w,h)*.026}' letter-spacing='3' fill='${fg}' fill-opacity='.45'>SAMPLE ART</text></svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}

const stage=$('#stage');

const CY=new Set(['svc1','counter','pillA','imgT','cEmail','cWA','cIG','cPh','cDots','cChip']); // cluster cards squeeze vertically on wide, short windows
function mountCards(){
  CARDS.forEach((c,i)=>{
    const el=document.createElement('div');
    el.className='card '+c.type.split(' ').map(x=>(x.startsWith('d-')||['a','b','link','decor'].includes(x))?x:'t-'+x).join(' ');
    if(c.type.startsWith('hero'))el.classList.add('hero');
    el.innerHTML=c.html();
    if(c.decor){el.style.background=c.col;if(c.kind==='chip')el.style.background='#1b1b1b'}
    if(c.open){el.addEventListener('click',e=>{if(!e.target.closest('a,button.btn'))c.open()})}
    c.el=el;c.idx=i;c.delay=c.decor?(i%9)*.04:Math.min(.5,i*.045);
    stage.appendChild(el);
  });
}
function layout(){
  VW=innerWidth;VH=innerHeight;
  MOB=VW/VH<.85;document.body.classList.toggle('mob',MOB);
  S=MOB?Math.min(VW/390,VH/844):Math.min(VW/1300,VH/780,Math.sqrt(VW/1440*VH/900));S=clamp(S,.28,1.9);
  const ky=Math.min(1,(VH/VW)/.625);
  P=1100*S;stage.style.perspective=P+'px';DW=MOB?30:60;
  CARDS.forEach(c=>{
    const g=MOB?c.m:c.d;c.x=g[0]*S;c.y=g[1]*S*(!MOB&&CY.has(c.id)?ky:1);c.z=g[2]*S;c.w=g[3]*S;c.h=g[4]*S;
    const st=c.el.style;st.width=c.w+'px';st.height=c.h+'px';st.marginLeft=-c.w/2+'px';st.marginTop=-c.h/2+'px';st.fontSize=(c.fs?c.fs(c.w,c.h):c.decor?c.h*.38:c.w/(c.dw?c.dw[MOB?1:0]:DW)*(MOB?1.12:1.16))+'px';
    if(c.decor&&c.kind==='bar')st.borderRadius='99em';
  });
  STOPS.forEach(s=>{const c=byId[s.card];const zz=MOB&&s.zm?s.zm:s.zoom;const d=P/zz-P;s.cam={x:c.x,y:c.y,z:c.z-d}});
  $('#spacer').style.height=((N-1)*.9+1)*VH+'px';
}

/* camera path: dwell 20% / move 60% (easeInOutQuart) / dwell 20% */
function camAt(p){

/* =====================================================================
   Render loop
   ===================================================================== */
let lastMove=0,cur=0,target=0,last=performance.now(),tStart=last,lastScroll=0,mx=0,my=0,smx=0,smy=0,hudIdx=-1,modalOpen=false,ctrLast='',galW=0;
let introMs=RM?0:2300;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  target=clamp(scrollY/stepPx(),0,N-1);
  cur=RM?target:cur+(target-cur)*(1-Math.pow(1-.085,dt*60));
  if(Math.abs(target-cur)<.0004)cur=target;
  const intro=introMs?clamp((now-tStart)/introMs,0,1):1;
  smx+=(mx-smx)*(1-Math.pow(.9,dt*60));smy+=(my-smy)*(1-Math.pow(.9,dt*60));
  if(!RM){const po=4-3.4*galW;stage.style.perspectiveOrigin=`${50+smx*po}% ${50+smy*po}%`}
  let galNow=0;
  const cam=camAt(cur),T=now/1000;
  for(let k=0;k<CARDS.length;k++){
    const c=CARDS[k];
    /* intro fly-in */
    const lo=clamp((intro*(1+.6)-c.delay)/1,0,1),eo=1-Math.pow(1-lo,3),fly=1-eo;
    let dz=c.z-cam.z+fly*P*1.3;
    const sc=P/(P+dz);
    let on=dz>-P*.4&&dz<P*3.1;
    if(!on){if(c.on){c.el.classList.remove('on','live','peek');c.on=false;c.live=c.peek=false}continue}
    /* focus distance in stops */
    let fd=9;for(const f of c.focus){const d=Math.abs(cur-f);if(d<fd)fd=d}
    let blur;
    if(c.decor){blur=3+smooth(Math.abs(dz)/(P*2.2))*15}
    else blur=smooth((fd-.06)/.55)*22;
    blur=blur/clamp(sc,.55,2.2)+fly*16;
    const near=smooth((dz+P*.38)/(P*.3)),far=1-smooth((dz-P*1.9)/(P*1.2));
    let op=near*far*(c.decor?.8:1)*(.3+.7*eo);
    if(op<.01){if(c.on){c.el.classList.remove('on','live','peek');c.on=false;c.live=c.peek=false}continue}
    /* tilt + float */
    const act=clamp(1-(now-lastMove)/700,0,1);   // tilt only while the pointer moves, so resting text is razor sharp
    const w=c.decor||RM?0:(1-smooth(fd/.4))*act;
    const gal=c.gal===undefined?(c.gal=c.el.classList.contains('t-film')):c.gal;   // video + design galleries: almost no tilt / float so the tiles stay calm
    if(gal)galNow=Math.max(galNow,1-smooth(fd/.4));
    const tk=gal?.7:5,tiltY=smx*tk*w,tiltX=-smy*tk*w;
    const fl=RM?0:Math.sin(T*.6+c.idx*1.7)*(c.decor?10:(gal?.6:4)*smooth(fd/.3))*S;
    const st=c.el.style;
    const tx=c.x-cam.x,ty=c.y-cam.y+fl,crisp=!c.decor&&fd<.02&&w===0;
    st.transform=crisp?`translate3d(${Math.round(tx)}px,${Math.round(ty)}px,${(-dz).toFixed(2)}px)`:`translate3d(${tx.toFixed(2)}px,${ty.toFixed(2)}px,${(-dz).toFixed(2)}px) rotateX(${tiltX.toFixed(2)}deg) rotateY(${tiltY.toFixed(2)}deg)`;
    const bq=Math.round(blur*4)/4;
    if(bq!==c._b){st.filter=bq>.3?`blur(${bq}px)`:'none';c._b=bq}
    st.opacity=op.toFixed(3);st.zIndex=Math.round((c.decor?4000:10000)-dz);   // decor always sits behind content cards, so a soft blob can never smear over text
    if(!c.on){c.el.classList.add('on');c.on=true}
    const live=!c.decor&&fd<.3&&op>.6&&!modalOpen;
    if(live!==c.live){c.el.classList.toggle('live',live);c.live=live}
    const peek=!c.decor&&!live&&fd<1.2&&op>.5&&!modalOpen;
    if(peek!==c.peek){c.el.classList.toggle('peek',peek);c.peek=peek}
  }
  galW+=(galNow-galW)*.12;
  /* backdrop: the hero photo fades as we leave the opening */
  $('#backdrop').style.opacity=(.6*(1-smooth(cur/2.2))*(.25+.75*Math.min(1,intro*3))).toFixed(3);
  /* counter card */
  const ct=String(1+Math.round(cur/(N-1)*(CONFIG.cluster.frames-1))).padStart(3,'0');if(ct!==ctrLast){const e=$('#ctr');if(e)e.textContent=ct;ctrLast=ct}
  /* HUD */
  const idx=Math.round(cur);if(idx!==hudIdx)setHud(idx);
  /* snap after 240ms idle */
  if(!modalOpen&&lastScroll&&now-lastScroll>240){
    lastScroll=0;const n=Math.round(target),dd=Math.abs(target-n);
    if(dd>.002&&dd<=.35)scrollTo({top:n*stepPx(),behavior:RM?'auto':'smooth'});
  }
  requestAnimationFrame(frame);
}

/* Plays a project video. Tries: 1) the path in CONFIG  2) the same file next to index.html  3) fetch -> blob URL.

function startVideo(vd,v){
  const names={1:'ABORTED',2:'NETWORK',3:'DECODE',4:'SRC_NOT_SUPPORTED (file missing, blocked, or codec not supported)'};
  const tries=[v.src];const m=/^videos\/(.+)$/.exec(v.src);if(m)tries.push(m[1]);tries.push('blob');
  let i=0;
  const next=()=>{
    const t=tries[i++];
    if(t===undefined)return fail();
    if(t==='blob'){
      fetch(v.src).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.blob()}).then(b=>{vd.src=URL.createObjectURL(b);vd.load();vd.play().catch(()=>{})}).catch(e=>{window.__vdErr=String(e);fail()});
      return;
    }

  };
  const fail=()=>{
    if($('#plr .note'))return;
    const e=vd.error,mt='video/mp4; codecs="avc1.42E01E, mp4a.40.2"';
    const info=[`file: ${String(v.src).slice(0,70)}${String(v.src).length>70?'…':''}`,`error: ${e?e.code+' '+names[e.code]:'none'}${e&&e.message?' — '+e.message:''}`,`network: ${vd.networkState} · ready: ${vd.readyState}`,`can play H.264/AAC: ${vd.canPlayType(mt)||'NO'}`,`page: ${location.protocol}//${location.host||'(local file)'}`,window.__vdErr?`fetch: ${window.__vdErr}`:''].filter(Boolean).join('  |  ');

    const inp=$('#plr .note input');
    inp.addEventListener('change',()=>{const f=inp.files[0];if(!f)return;vd.src=URL.createObjectURL(f);vd.load();vd.play().catch(()=>{});const n=$('#plr .note');if(n)n.remove()});
  };
  vd.addEventListener('error',next);
  vd.addEventListener('playing',()=>{const n=$('#plr .note');if(n)n.remove()});
  next();
}

            <div class="ccred"><div><small>Edited by</small><b>${esc(CONFIG.brand.name)}</b></div><div><small>Category</small><b>${esc(v.category)}</b></div>${CONFIG.brand.city?`<div><small>Based in</small><b>${esc(CONFIG.brand.city.split(',')[0])}</b></div>`:''}</div></div>
          <div class="cfacts">${facts}</div>
          <button class="cbig" data-act="cpp" aria-label="Play or pause">${ICO.pause}</button>
          <div class="cshare"><button data-act="copy" data-ok="Link copied ✓" data-v="${esc(url)}">Share ↗</button><a target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(v.title+' — '+url)}">WhatsApp</a>${next?`<button class="cnextm" data-act="cgo" data-id="${esc(next.id)}" data-dir="1">Next film ↓</button>`:''}</div>
        </div>
      </div>
    </div>`;
  const fr=$('#cframe');if(CINE.vd&&CINE.vd.destroy)CINE.vd.destroy();
  const vd=CINE.vd=v.vm?new VM($('#vmf')):$('#pmBody video');
  history.replaceState(null,'','#v-'+v.id);
  if(!vd)return;
  const seek=$('#pmBody .seek'),t0=$('#pmBody .t0'),t1=$('#pmBody .t1');
  const icons=()=>{const pl=!vd.paused;$$('[data-act="cpp"]').forEach(b=>b.innerHTML=pl?ICO.pause:ICO.play);$$('[data-act="cmute"]').forEach(b=>b.innerHTML=vd.muted?ICO.mute:ICO.vol)};
  const ui=on=>{clearTimeout(CINE.ui);fr.classList.toggle('ui',on||vd.paused);if(on&&!vd.paused&&!MOB)CINE.ui=setTimeout(()=>fr.classList.remove('ui'),3200)};
  CINE.show=()=>ui(true);
  vd.addEventListener('loadedmetadata',()=>{t1.textContent=mmss(vd.duration);if(vd.videoHeight>vd.videoWidth)fr.classList.add('portrait')});
  vd.addEventListener('timeupdate',()=>{if(!vd.duration)return;const p=vd.currentTime/vd.duration*1000;seek.value=p;seek.style.setProperty('--p',(p/10)+'%');t0.textContent=mmss(vd.currentTime)});
  vd.addEventListener('play',()=>{icons();ui(true)});vd.addEventListener('pause',()=>{icons();ui(true)});vd.addEventListener('ended',()=>{icons();ui(true)});
  vd.addEventListener('volumechange',icons);
  seek.addEventListener('input',()=>{if(vd.duration){vd.currentTime=seek.value/1000*vd.duration}});
  vd.addEventListener('click',()=>cinePP());
  fr.addEventListener('pointermove',()=>{if(!MOB)ui(true)});
  if(!v.vm)startVideo(vd,v);icons();ui(true);
}
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function cinePP(){const vd=CINE.vd;if(!vd)return;if(vd.paused){if(vd.ended)vd.currentTime=0;vd.play().catch(()=>{})}else vd.pause()}
function cineGo(id,dir){
  const v=DATA.videos.find(x=>x.id===id);if(!v||v.id===CINE.id||CINE.busy)return;CINE.busy=true;
  const body=$('#pm .pm'),d=dir>0?'D':'U';body.classList.add('go'+d);
  setTimeout(()=>{const o=CINE.vd;if(o){o.pause();if(o.destroy)o.destroy();else{o.removeAttribute('src');o.load()}}
    renderCine(v);body.classList.remove('go'+d);body.classList.add('in'+d);
    setTimeout(()=>{body.classList.remove('in'+d);CINE.busy=false},RM?0:560)},RM?0:300);
}
function cineStep(d){const L=DATA.videos;if(L.length<2)return;const i=L.findIndex(x=>x.id===CINE.id);cineGo(L[(i+d+L.length)%L.length].id,d)}
function openVideo(id){
  const v=DATA.videos.find(x=>x.id===id);if(!v)return;
  CINE.busy=false;renderCine(v);
  if(!openEl)showOv(pm);
}
/* wheel / swipe up-down moves between films (desktop) */
(()=>{let t=0;pm.addEventListener('wheel',e=>{if(MOB||openEl!==pm||e.target.closest('.clist')||Math.abs(e.deltaY)<18)return;const n=performance.now();if(n-t<900)return;t=n;cineStep(e.deltaY>0?1:-1)},{passive:true})})();
document.addEventListener('click',e=>{if(!e.target.closest('.cswitch')){const s=$('#pm .cswitch');if(s)s.classList.remove('open')}});
let LB={list:[],i:0,z:1,x:0,y:0};
function openDesign(id,list){
  LB.list=list||DATA.designs.filter(d=>LIB.d.cat==='All'||true);LB.i=Math.max(0,LB.list.findIndex(d=>d.id===id));lbShow();if(openEl!==lb)showOv(lb);
}
function lbShow(){
  const d=LB.list[LB.i];if(!d)return;const im=$('#lbImg');im.src=art(d);im.alt=d.title;
  $('#lbT').textContent=d.title;$('#lbD').textContent=d.desc||'';
  $('#lbM').textContent=[d.category,(d.software||[]).join(' + '),d.timeline,pad(LB.i+1)+'/'+pad(LB.list.length)].filter(Boolean).join('  ·  ');
  lbReset();
}
function lbApply(){
  const im=$('#lbImg');im.style.transform=`translate(${LB.x}px,${LB.y}px) scale(${LB.z}) translate(-50%,-50%)`;
  $('#lbStage').classList.toggle('z',LB.z>1.01);$('#lbStage').style.cursor=LB.z>1.01?'grab':'zoom-in';
}
function lbReset(){LB.z=1;LB.x=0;LB.y=0;lbApply()}
function lbZoom(f,cx,cy){
  const st=$('#lbStage').getBoundingClientRect();const ox=(cx??st.left+st.width/2)-(st.left+st.width/2),oy=(cy??st.top+st.height/2)-(st.top+st.height/2);
  const nz=clamp(LB.z*f,1,6);const r=nz/LB.z;LB.x=nz===1?0:ox-(ox-LB.x)*r;LB.y=nz===1?0:oy-(oy-LB.y)*r;LB.z=nz;lbApply();
}
function lbStep(d){LB.i=(LB.i+d+LB.list.length)%LB.list.length;lbShow()}
(()=>{
  const sg=$('#lbStage');let drag=null,moved=0;
  sg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,ox:LB.x,oy:LB.y};moved=0;sg.setPointerCapture(e.pointerId);if(LB.z>1.01)sg.classList.add('drag')});
  sg.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));if(LB.z>1.01){LB.x=drag.ox+dx;LB.y=drag.oy+dy;lbApply()}});
  sg.addEventListener('pointerup',e=>{sg.classList.remove('drag');if(drag&&moved<6)LB.z>1.01?lbReset():lbZoom(2.6,e.clientX,e.clientY);drag=null});
  sg.addEventListener('wheel',e=>{e.preventDefault();lbZoom(e.deltaY<0?1.2:1/1.2,e.clientX,e.clientY)},{passive:false});
})();

/* =====================================================================
   Central click delegation
   ===================================================================== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='goto'){e.preventDefault();hideOv();goTo(t.dataset.id?si(t.dataset.id):+t.dataset.i)}
  else if(a==='close')hideOv();
  else if(a==='cgo'){const sw=$('#pm .cswitch');if(sw)sw.classList.remove('open');cineGo(t.dataset.id,+t.dataset.dir||1)}
  else if(a==='cmenu'){t.closest('.cswitch').classList.toggle('open')}
  else if(a==='cpp')cinePP();
  else if(a==='cvclick')cinePP();
  else if(a==='cmute'){const vd=CINE.vd;if(vd)vd.muted=!vd.muted}
  else if(a==='cfs'){const f=$('#cframe');if(document.fullscreenElement)document.exitFullscreen();else if(f&&f.requestFullscreen)f.requestFullscreen().catch(()=>{});else{const vd=CINE.vd;if(vd&&vd.webkitEnterFullscreen)vd.webkitEnterFullscreen()}}
  else if(a==='video')openVideo(t.dataset.id);
  else if(a==='design'){const k=LIB.d,q=k.q.trim().toLowerCase();const list=DATA.designs.filter(x=>(k.cat==='All'||x.category===k.cat)&&(!q||(x.title+' '+x.category+' '+(x.desc||'')).toLowerCase().includes(q)));openDesign(t.dataset.id,list.some(x=>x.id===t.dataset.id)?list:DATA.designs)}
  else if(a==='vcat'){LIB.v.cat=t.dataset.v;LIB.v.page=0;renderLib('v')}
  else if(a==='dcat'){LIB.d.cat=t.dataset.v;LIB.d.page=0;renderLib('d')}
  else if(a==='fscroll'){const st=t.closest('.rw').querySelector('.fstrip');st.scrollBy({left:+t.dataset.d*st.clientWidth*.8,behavior:RM?'auto':'smooth'})}
  else if(a==='lbprev')lbStep(-1);else if(a==='lbnext')lbStep(1);
  else if(a==='lbzin')lbZoom(1.5);else if(a==='lbzout')lbZoom(1/1.5);else if(a==='lbreset')lbReset();
  else if(a==='copy'){
    const v=t.dataset.v,old=t.textContent;
    const done=()=>{t.textContent=t.dataset.ok||'Copied ✓';setTimeout(()=>t.textContent=old,1600)};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(done,()=>fb());else fb();
    function fb(){const x=document.createElement('textarea');x.value=v;x.style.position='fixed';x.style.opacity='0';document.body.appendChild(x);x.select();try{document.execCommand('copy')}catch(_){}x.remove();done()}
  }
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.lib){LIB[t.dataset.lib].q=t.value;LIB[t.dataset.lib].page=0;renderLib(t.dataset.lib)}});
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(e.key==='Enter'&&e.target.classList&&(e.target.classList.contains('tile')||e.target.classList.contains('pst'))){e.target.click();return}
  if(openEl){
    if(e.key==='Escape')hideOv();
    else if(openEl===pm&&e.target.type!=='range'){const vd=CINE.vd;
      if(e.key==='ArrowDown'){e.preventDefault();cineStep(1)}else if(e.key==='ArrowUp'){e.preventDefault();cineStep(-1)}
      else if(e.key===' '&&!/^(button|a)$/i.test(e.target.tagName)){e.preventDefault();cinePP()}
      else if(e.key==='ArrowRight'&&vd){vd.currentTime=Math.min(vd.duration||1e9,vd.currentTime+5)}else if(e.key==='ArrowLeft'&&vd){vd.currentTime=Math.max(0,vd.currentTime-5)}
      else if(e.key==='f'||e.key==='F'){const b=$('[data-act="cfs"]');if(b)b.click()}else if(e.key==='m'||e.key==='M'){if(vd)vd.muted=!vd.muted}
      if(CINE.show)CINE.show()}
    else if(openEl===lb){if(e.key==='ArrowLeft')lbStep(-1);else if(e.key==='ArrowRight')lbStep(1);else if(e.key==='+'||e.key==='=')lbZoom(1.5);else if(e.key==='-')lbZoom(1/1.5);else if(e.key==='0')lbReset()}
    return;
  }
  if(['input','textarea','select'].includes(tag))return;
  const cI=Math.round(target);let k=null;
  if(['ArrowDown','ArrowRight','PageDown'].includes(e.key))k=cI+1;
  else if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key))k=cI-1;
  else if(e.key==='Home')k=0;else if(e.key==='End')k=N-1;
  if(k!==null){e.preventDefault();goTo(k)}
});
addEventListener('scroll',()=>{lastScroll=performance.now()},{passive:true});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{layout();renderLib('v');renderLib('d')},120)});

/* =====================================================================
   Contact form
   ===================================================================== */
document.addEventListener('submit',async e=>{
  if(e.target.id!=='cf')return;e.preventDefault();
  const f=e.target,st=$('#cfSt'),d=Object.fromEntries(new FormData(f));
  if(d.website_url)return;                                  // honeypot
  if(!d.name||!/^\S+@\S+\.\S+$/.test(d.email||'')||!d.msg){st.textContent='Please fill name, a valid email and a message.';return}
  d.phone=(d.phone||'').trim();d.instagram=(d.instagram||'').trim().replace(/^https?:\/\/(www\.)?instagram\.com\//i,'').replace(/^@/,'').replace(/[\/?#].*$/,'');
  if(d.phone&&!/^\+?[\d\s().-]{7,20}$/.test(d.phone)){st.textContent='Please enter a valid phone number, or leave it empty.';return}
  if(d.instagram&&!/^[A-Za-z0-9._]{1,30}$/.test(d.instagram)){st.textContent='Instagram ID can only have letters, numbers, dots and underscores.';return}
  const ep=CONFIG.contact.formEndpoint;
  if(ep){
    st.textContent='Sending…';
    try{const r=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({...(CONFIG.contact.formKey?{access_key:CONFIG.contact.formKey,subject:'New project enquiry (portfolio)'}:{}),name:d.name,email:d.email,phone:d.phone,instagram:d.instagram,type:d.type,message:d.msg})});
      if(!r.ok)throw 0;st.textContent='Sent ✓ — I’ll reply soon.';f.reset()}catch(_){st.textContent='Could not send. Please email me directly.'}
  }else{
    const body=`Hi, I'm ${d.name} (${d.email}).${d.phone?'\nPhone: '+d.phone:''}${d.instagram?'\nInstagram: @'+d.instagram:''}\nProject: ${d.type}\n\n${d.msg}`;
    location.href=`mailto:${CONFIG.contact.email}?subject=${encodeURIComponent('Project enquiry — '+d.type)}&body=${encodeURIComponent(body)}`;
    st.textContent='Opening your mail app…';
  }
});

/* =====================================================================
   Boot
   ===================================================================== */
function applyTheme(){
  const r=document.documentElement.style,c=CONFIG.colors;
  r.setProperty('--bg',c.bg);r.setProperty('--text',c.text);r.setProperty('--accent',c.accent);r.setProperty('--second',c.second);
  r.setProperty('--aboutPos',CONFIG.about.pos);r.setProperty('--aboutPosM',CONFIG.about.posMobile);r.setProperty('--heroPos',CONFIG.hero.pos);r.setProperty('--heroPosM',CONFIG.hero.posMobile);
  $('#backdrop').style.backgroundImage=`url("${CONFIG.hero.img}")`;
  $('#logo').textContent=CONFIG.brand.short;$('#hlink').textContent=CONFIG.hudLink;$('#yr').textContent=CONFIG.brand.year;
  $('#dots').innerHTML=CONFIG.chapters.map((c,i)=>`<button data-act="goto" data-i="${i}" aria-label="${esc(c.name)}"></button>`).join('');
}
function seoText(){
  const B=CONFIG.brand,C=CONFIG.contact;
  $('#seo').innerHTML=`<h1>${esc(B.name)} — ${esc(B.role)}</h1><p>${esc(CONFIG.hero.sub)}</p>
  <h2>Video editing</h2><ul>${CONFIG.services.video.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
  <h2>Graphic design</h2><ul>${CONFIG.services.design.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
  <h2>Films</h2><ul>${DATA.videos.map(v=>`<li>${esc(v.title)} — ${esc(v.category)}. ${esc(v.desc||'')}</li>`).join('')}</ul>
  <h2>Designs</h2><ul>${DATA.designs.map(d=>`<li>${esc(d.title)} — ${esc(d.category)}. ${esc(d.desc||'')}</li>`).join('')}</ul>
  <h2>About</h2><p>${esc(CONFIG.about.text)}</p><h2>Contact</h2><p>Email: ${esc(C.email)} · Phone: ${esc(C.phone)} · Instagram: ${esc(C.instagramHandle)} ${B.city?'· '+esc(B.city):''}</p>`;
}
async function boot(){
  history.scrollRestoration='manual';scrollTo(0,0);
  if(CONFIG.dataUrl&&/^https?:$/.test(location.protocol)){
    try{
      const ac=new AbortController(),to=setTimeout(()=>ac.abort(),3500);
      const r=await fetch(CONFIG.dataUrl,{signal:ac.signal,cache:'no-store'});clearTimeout(to);
      if(r.ok&&/json/.test(r.headers.get('content-type')||'')){
        const j=await r.json();
        if(Array.isArray(j.videos)&&j.videos.length)DATA.videos=j.videos;
        if(Array.isArray(j.designs)&&j.designs.length)DATA.designs=j.designs;
        for(const k of ['brand','cluster','hero','about','contact'])if(j[k]&&typeof j[k]==='object')Object.assign(CONFIG[k],j[k]);
        if(j.services)for(const k of ['video','design'])if(j.services[k])Object.assign(CONFIG.services[k],j.services[k]);
        if(Array.isArray(j.videoCats)&&j.videoCats.length)CONFIG.videoCats=j.videoCats;
        if(Array.isArray(j.designCats)&&j.designCats.length)CONFIG.designCats=j.designCats;
      }
    }catch(_){}
  }
  if(window.SITE_SETTINGS){const S=window.SITE_SETTINGS;if(S.sheet)Object.assign(CONFIG.sheet,S.sheet);if(S.vimeoControls)CONFIG.vimeoControls=S.vimeoControls;if(S.formEndpoint)CONFIG.contact.formEndpoint=S.formEndpoint;if(S.formKey)CONFIG.contact.formKey=S.formKey}
  await loadSheet();normVideos(DATA.videos);await vmEnrich(DATA.videos);
  applyTheme();buildCards();mountCards();layout();renderLib('v');renderLib('d');seoText();
  setHud(0);
  const h=location.hash.match(/^#v-(.+)$/);if(h)setTimeout(()=>openVideo(decodeURIComponent(h[1])),600);
  tStart=performance.now();last=tStart;requestAnimationFrame(frame);
}
boot();
